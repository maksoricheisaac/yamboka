name: yamboka-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yamboka
      POSTGRES_PASSWORD: yamboka_dev_password
      POSTGRES_DB: yamboka_dev
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yamboka -d yamboka_dev"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
volumes:
  pgdata:
